name: Feature request
description: Suggest an idea or an improvement for DSU Next
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search the existing issues first, someone may have asked for it already.

  - type: dropdown
    id: area
    attributes:
      label: Which part is it about?
      options:
        - Installing a GSI as a DSU
        - Edit GSI
        - Treble check
        - Settings, theme or design
        - Build, CI or documentation
        - Something new
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Explain what you are trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe how it could work. Mockups and examples help.
    validations:
      required: true

  - type: dropdown
    id: modes
    attributes:
      label: Does it need elevated access?
      description: If you know, tell us how the feature would reach the system.
      options:
        - No, it works without root or Shizuku
        - It needs Shizuku or root
        - It needs root
        - I do not know
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, or other apps that do it well.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with some guidance"
        - "No"
    validations:
      required: false
